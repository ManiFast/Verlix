name: Build Windows MSI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build WPF and MSI
        shell: powershell
        run: ./scripts/Build.ps1
      - name: Open WPF window without running protection tests
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/Smoke-Window.ps1 -ExePath src/Velrix/bin/Release/net48/Velrix.exe
      - name: Test MSI install and uninstall
        shell: powershell
        run: ./scripts/Smoke-Installer.ps1 -MsiPath artifacts/Velrix-1.0.0-x64.msi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Velrix-windows
          path: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/*.txt
            artifacts/*.png
            artifacts/*.log
          if-no-files-found: error
      - name: Publish first stable release
        if: success() && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY 2>$null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if (!$exists) {
            gh release create v1.0.0 artifacts/Velrix-1.0.0-x64.msi artifacts/Velrix-1.0.0-portable.zip artifacts/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Velrix 1.0.0' --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          }
          exit 0
